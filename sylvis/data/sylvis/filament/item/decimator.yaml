  de_de: Zerstörer
item_tags:
  - 'minecraft:enchantable/sharp_weapon'
  - 'minecraft:enchantable/mace'
  - 'minecraft:enchantable/weapon'
  - 'minecraft:enchantable/durability'
  - 'minecraft:enchantable/melee_weapon'
item_resource:
